name: Build

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: KoboRoot.tgz
          archive: false
