name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - test
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: KoboRoot.tgz
          path: .

      - name: Generate release notes
        run: |
          prev_tag=$(git tag --list --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1)

          echo "## Commits" > notes.md
          if [ -n "$prev_tag" ]; then
            git log --pretty=format:'- %s (%h)' "${prev_tag}..${GITHUB_REF_NAME}" >> notes.md
          else
            git log --pretty=format:'- %s (%h)' "${GITHUB_REF_NAME}" >> notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" KoboRoot.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md
