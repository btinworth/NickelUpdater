name: CodeQL

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 * * 0

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pgaskin/nickeltc:1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: CodeQL Init
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: |
          make clean
          make
          make koboroot

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:cpp
