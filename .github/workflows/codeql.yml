name: CodeQL

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 * * 0

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nicoverbruggen/kobuild:qt5-v0.1.0

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: CodeQL Init
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: |
          cmake -S . -B build/qt5 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tc/qt5/toolchain.cmake

          cmake --build build/qt5 --target nickelupdater

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:cpp
